services:
  backend:
    build: ./backend
    expose:
      - "8888"  # Expose without publishing to host
    depends_on:
      - db
    environment:
      - FLASK_ENV=development
    volumes:
      - ./backend/models:/app/models
      - ./uploads:/app/uploads
      - ./var/log/humblehome:/app/var/log/humblehome

  frontend:
    build: ./frontend
    ports:
      - "80:80"        # Nginx serves React on port 80 inside container
      - "443:443"      # Expose HTTPS port
    depends_on:
      - backend
    volumes:
      - ./frontend/certs:/etc/nginx/certs  

  # nginx:
  #   image: nginx:latest
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
  #     - ./frontend/certs:/etc/nginx/certs
  #   depends_on:
  #     - frontend
  #     - backend

  db:
    image: mysql:8
    restart: always
    ports: 
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: humblehome
    volumes:
      - dbdata:/var/lib/mysql
      - ./initdb:/docker-entrypoint-initdb.d

volumes:
  dbdata:
