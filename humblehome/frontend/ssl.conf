server {
    listen 80;
    server_name humblehome.mooo.com;

    # Redirect all HTTP requests to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name humblehome.mooo.com;

    ssl_certificate /etc/letsencrypt/live/humblehome.mooo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/humblehome.mooo.com/privkey.pem;


    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_log_level info; # Log requests that hit the limit
        limit_req_status 429;     # Return 429 Too Many Requests status code

        proxy_pass http://backend:8888/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    location /admin/ {
        limit_req zone=admin_limit burst=5 nodelay;
        limit_req_log_level info; # Log requests that hit the limit
        limit_req_status 429;     # Return 429 Too Many Requests status code

        proxy_pass http://backend:8888/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=general_limit burst=10 nodelay;
        limit_req_log_level info; # Log requests that hit the limit
        limit_req_status 429;     # Return 429 Too Many Requests status code

        try_files $uri /index.html;
    }
}