# Custom log format for more detailed logging
log_format detailed 'CLIENT_IP: $remote_addr | TIMESTAMP: [$time_local] | '
                    'REQUEST: "$request" | STATUS: $status | RESPONSE_SIZE: $body_bytes_sent bytes | '
                    'REFERER: "$http_referer" | USER_AGENT: "$http_user_agent" | '
                    'REQUEST_TIME: ${request_time}s | UPSTREAM_TIME: ${upstream_response_time}s';

server {
    listen 80;
    server_name humblehome.mooo.com;

    # Redirect all HTTP requests to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name humblehome.mooo.com;

    # Apply the detailed format to access_log that captures all requests
    access_log /var/log/nginx/access.log detailed; 

    # error_log doesn't use custom formats - it has its own format
    error_log /var/log/nginx/error.log;

    ssl_certificate /etc/letsencrypt/live/humblehome.mooo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/humblehome.mooo.com/privkey.pem;


    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always; #HSTS
    add_header X-Content-Type-Options "nosniff" always; #MIME Sniffing
    add_header X-Frame-Options "DENY" always; #Clickjacking
    add_header X-XSS-Protection "1; mode=block" always; #XSS
    add_header Referrer-Policy "strict-origin-when-cross-origin" always; #Referrer
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; frame-ancestors 'none';" always; #CSP

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_log_level info; # Log requests that hit the limit
        limit_req_status 429;     # Return 429 Too Many Requests status code

        proxy_pass http://backend:8888/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Separate API access log with detailed format
        access_log /var/log/nginx/api.log detailed;
    }
    
    location /admin/ {
        limit_req zone=admin_limit burst=5 nodelay;
        limit_req_log_level info; # Log requests that hit the limit
        limit_req_status 429;     # Return 429 Too Many Requests status code

        proxy_pass http://backend:8888/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=general_limit burst=10 nodelay;
        limit_req_log_level info; # Log requests that hit the limit
        limit_req_status 429;     # Return 429 Too Many Requests status code

        try_files $uri /index.html;
    }
}